version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: indexpilot-postgres
    environment:
      POSTGRES_USER: indexpilot
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: indexpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: indexpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IndexPilot Application
  app:
    build: .
    container_name: indexpilot-app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://indexpilot:postgres@postgres:5432/indexpilot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
